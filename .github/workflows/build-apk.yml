name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Live2D assets
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/AvatarStage/index.html
          test -s app/src/main/assets/AvatarStage/bridge.js
          ls app/src/main/assets/DeepSeekChan

      - name: Create the signing key once (keeps updates installable over old versions)
        shell: bash
        run: |
          set -euo pipefail
          keystore=keystore/feiyu-release.jks
          if [ ! -f "$keystore" ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore "$keystore" -alias feiyu -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass feiyu-companion -keypass feiyu-companion -dname "CN=FeiYu Companion, O=Personal, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$keystore"
            git commit -m "Add Android signing key (so new APKs install over old ones)"
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::warning::Could not commit the signing key. Download the FeiYu-Android-Keystore artifact and commit it to keystore/feiyu-release.jks, otherwise every build has a new signature."
            fi
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F "assets/AvatarStage/index.html"
          unzip -l "$apk" | grep -F "assets/AvatarStage/stage.js"
          unzip -l "$apk" | grep -F "model3.json"
          unzip -l "$apk" | grep -F ".moc3"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" | head -5
          "$tools/aapt2" dump badging "$apk" | head -3
          mkdir -p artifacts
          cp "$apk" artifacts/FeiYuCompanion-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeiYuCompanion-APK
          path: artifacts/FeiYuCompanion-Android.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: FeiYu-Android-Keystore
          path: keystore/feiyu-release.jks
          if-no-files-found: warn
          retention-days: 7
